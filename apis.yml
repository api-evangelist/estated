aid: estated
name: Estated
description: >-
  Estated is a property-data company that operates a JSON REST API returning detailed U.S. residential and commercial
  property records — assessor data, parcel geometry, structure characteristics, taxes, assessments, market assessments,
  valuation (AVM), owner of record, deeds, and parcel boundaries. Lookups can be performed by split address, parsed
  address components, a single combined address string, or by FIPS county code + assessor parcel number (APN). The
  current public surface is the Property Data API v4 at `https://apis.estated.com/v4/property`, authenticated with a
  `token` query parameter. Estated was acquired by ATTOM Data in 2020 and its infrastructure is being migrated to ATTOM;
  the Estated developer documentation is scheduled to be deprecated during 2026, after which property data access will
  be served through ATTOM's documentation and endpoints. Existing Estated tokens continue to work through the transition
  and no integration changes are required during the migration window.
